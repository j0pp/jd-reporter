# weekly: diff the feashliaa postings dump against known boards. zero ats requests; new boards get their
# first real read in the next daily crawl
name: discover

on:
  schedule:
    - cron: '0 5 * * 1' # mondays 05:00 utc
  workflow_dispatch:
    inputs:
      dry_run:
        description: count only, write nothing
        type: boolean
        default: false

concurrency:
  group: crawl
  cancel-in-progress: false

env:
  DB_MODE: d1
  CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
  CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
  D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
  USER_AGENT: ${{ vars.USER_AGENT }}

jobs:
  discover:
    runs-on: ubuntu-latest
    if: ${{ vars.PIPELINE_ENABLED == 'true' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @jdr/crawler cli discover ${{ inputs.dry_run && '--dry-run' || '' }}
